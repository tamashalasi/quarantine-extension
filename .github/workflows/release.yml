name: Release extension
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require tag and package version to agree
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || version.split('.').some(part => Number(part) > 65535) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match a browser-compatible package.json version.');
          }
          JS
      - name: Build release artifacts with the pinned toolchain
        run: |
          docker build --platform linux/amd64 --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" -f build-support/Dockerfile -t quarantine-release .
          mkdir -p dist/release
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD/dist/release:/out" quarantine-release
      - name: Publish release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/release/quarantine-chromium.zip dist/release/quarantine-firefox.zip dist/release/SHA256SUMS dist/release/build-info.json)
          if gh release view "$GITHUB_REF_NAME" --json isDraft > dist/release-status.json 2>/dev/null; then
            node --input-type=module -e "import fs from 'node:fs'; if (!JSON.parse(fs.readFileSync('dist/release-status.json')).isDraft) throw new Error('This release is already published.');"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --draft --title "Quarantine $GITHUB_REF_NAME" --generate-notes --notes-file build-support/release-notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
